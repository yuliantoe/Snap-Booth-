<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Aplikasi photobooth interaktif untuk mengambil/mengunggah foto, menerapkan filter & kustomisasi tema acara, serta cetak instan dan berbagi ke media sosial." />
    <meta property="og:title" content="SnapBooth Receipt" />
    <meta property="og:description" content="Aplikasi photobooth interaktif untuk mengambil/mengunggah foto, menerapkan filter & kustomisasi tema acara, serta cetak instan dan berbagi ke media sosial." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <title>SnapBooth Receipt</title>
    <script>
      (function() {
        // Prevent extension rejections from surfacing as uncaught errors
        window.addEventListener('unhandledrejection', function (event) {
          var reason = '';
          try {
            if (typeof event.reason === 'string') {
              reason = event.reason;
            } else if (event.reason) {
              reason = event.reason.message || event.reason.stack || JSON.stringify(event.reason);
            }
          } catch (e) {}
          
          if (/metamask|ethereum|wallet|web3/i.test(reason) || !reason) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function (event) {
          var msg = (event && (event.message || event.filename)) || '';
          if (/metamask|ethereum|wallet|web3/i.test(msg)) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
